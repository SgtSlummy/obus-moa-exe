<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Obus – Solomonic Key Emblem">
<title>Obus Solomonic Key Emblem</title>
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1a2148"/><stop offset="100%" stop-color="#050711"/></radialGradient>
  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f5c451"/><stop offset="100%" stop-color="#d4af37"/></linearGradient>
</defs>
<rect width="512" height="512" rx="64" fill="url(#bg)"/>
<!-- Solomonic ring -->
<circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="2"/>
<!-- 72 ticks -->
<g stroke="url(#gold)" stroke-width="2" opacity=".6">
  <circle cx="256" cy="46" r="4"/>
  <circle cx="352" cy="73" r="4"/>
  <circle cx="421" cy="152" r="4"/>
  <circle cx="452" cy="256" r="4"/>
  <circle cx="421" cy="360" r="4"/>
  <circle cx="352" cy="439" r="4"/>
  <circle cx="256" cy="469" r="4"/>
  <circle cx="160" cy="439" r="4"/>
  <circle cx="91" cy="360" r="4"/>
  <circle cx="60" cy="256" r="4"/>
  <circle cx="91" cy="152" r="4"/>
  <circle cx="160" cy="73" r="4"/>
</g>
<!-- Key -->
<path d="M236 120 L236 340 L276 340 L276 120" rx="10" fill="url(#gold)"/>
<circle cx="256" cy="110" r="36" fill="none" stroke="url(#gold)" stroke-width="6"/>
<circle cx="256" cy="110" r="12" fill="#050711" stroke="url(#gold)" stroke-width="4"/>
<rect x="260" y="310" width="28" height="8" rx="2" fill="url(#gold)"/>
<rect x="268" y="325" width="18" height="8" rx="2" fill="url(#gold)"/>
<!-- Infinity symbol -->
<path d="M216 170 C216 140 284 140 284 170 C284 200 216 200 216 170 Z" fill="none" stroke="#f5c451" stroke-width="6"/>
<!-- Four elemental sigils (simple shapes) -->
<polygon points="176,196 186,218 166,218" fill="#ff9f43"/>
<ellipse cx="316" cy="196" rx="12" ry="16" fill="#3ca9ef"/>
<path d="M156 260 Q176 250 196 260" fill="none" stroke="#4f8eff" stroke-width="4"/>
<path d="M316 260 L316 270 L324 260 Z" fill="#d69b72"/>
<!-- Title -->
<text x="256" y="470" text-anchor="middle" fill="#929ab4" font-family="Segoe UI,Arial" font-size="12">OBUS</text>
</svg>