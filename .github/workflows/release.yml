name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build and verification dependencies
        run: python -m pip install --upgrade pip pytest pip-audit pyinstaller ruff mypy && python -m pip install -r requirements.txt

      - name: Verify release source
        run: |
          python -m compileall -q backend tools scripts
          python -m pytest -q
          python -m pytest -q tools/obus_launcher/test_obus_launcher.py
          python -m pip_audit

      - name: Build production executable
        shell: pwsh
        run: ./tools/obus_launcher/build_and_install.ps1 -SkipInstall -PythonPath python

      - name: Authenticode sign executable
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP 'obus-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $signature = Set-AuthenticodeSignature -FilePath tools\obus_launcher\dist\Obus.exe -Certificate $certificate -TimestampServer http://timestamp.digicert.com -HashAlgorithm SHA256
          Remove-Item -LiteralPath $pfxPath -Force
          if ($signature.Status -ne 'Valid') { throw "Authenticode signing failed: $($signature.StatusMessage)" }

      - name: Require valid signature when signing is configured
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature tools\obus_launcher\dist\Obus.exe
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $signature.Status -ne 'Valid') { throw 'Release signature is not valid.' }
          "SignatureStatus=$($signature.Status)" | Set-Content tools\obus_launcher\dist\signature.txt
          (Get-FileHash tools\obus_launcher\dist\Obus.exe -Algorithm SHA256).Hash + '  Obus.exe' | Set-Content tools\obus_launcher\dist\SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            tools/obus_launcher/dist/Obus.exe
            tools/obus_launcher/dist/SHA256SUMS.txt
            tools/obus_launcher/dist/signature.txt
