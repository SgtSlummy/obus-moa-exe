name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install application and verification dependencies
        run: python -m pip install --upgrade pip pytest pip-audit pyinstaller ruff mypy && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend tools scripts

      - name: Run correctness lint
        run: python -m ruff check backend tools scripts tests --select E9,F63,F7,F82

      - name: Run high-impact security lint
        run: python -m ruff check backend --select S102,S301,S302,S307,S506,S602,S608 --exclude backend/tmp,backend/scripts

      - name: Type-check provider and launcher runtime
        run: python -m mypy backend/persistent_agents.py tools/obus_launcher/obus_launcher.py --ignore-missing-imports --follow-imports=silent --explicit-package-bases

      - name: Run application suite
        run: python -m pytest -q

      - name: Run launcher contracts
        run: python -m pytest -q tools/obus_launcher/test_obus_launcher.py

      - name: Build production executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/obus_launcher/build_and_install.ps1 -SkipInstall -PythonPath python

      - name: Upload production executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Obus-windows-${{ github.sha }}
          path: tools/obus_launcher/dist/Obus.exe
          if-no-files-found: error

      - name: Audit installed dependencies
        run: python -m pip_audit
