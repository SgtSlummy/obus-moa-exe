<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBus Relay Pad</title><style>
:root{color-scheme:dark}body{max-width:480px;margin:9vh auto;padding:24px;font:16px system-ui;background:#07131a;color:#e8f6fb}.card{background:#10262f;border:1px solid #32606b;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0007}h1{margin:0;color:#72e1d1}p{color:#b9d2d7}label{display:block;margin:14px 0 4px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;font:inherit}input{border:1px solid #53808a;background:#07131a;color:white}button{margin-top:12px;border:0;font-weight:700;cursor:pointer;background:#72e1d1;color:#062028}#talk{min-height:90px;background:#ff866d;color:#310a04;font-size:22px}#talk[aria-pressed=true]{background:#ffcf58}#status{min-height:24px;text-align:center}small{display:block;color:#9ab6bc;margin-top:18px}</style></head><body><main class="card"><h1>OBus Relay Pad</h1><p>Thor microphone node · push to talk</p><label for="host">OBus host</label><input id="host" value="http://100.73.36.108:8000" inputmode="url"><label for="room">Room</label><input id="room" value="thor-mic"><label for="key">Shared key</label><input id="key" type="password" autocomplete="off"><button id="connect">Connect to OBus</button><button id="talk" disabled aria-pressed="false">Hold to talk</button><button id="disconnect" disabled>Disconnect</button><p id="status">Offline</p><small>The key stays in this page only. Audio leaves this PC only while the talk button is held.</small></main><script>
let socket,recorder,stream;const $=id=>document.getElementById(id),status=$('status'),talk=$('talk');function state(message){status.textContent=message}function wsUrl(value){const url=new URL(value);url.protocol=url.protocol==='https:'?'wss:':'ws:';url.pathname='/api/voice-link/stream';url.search='';url.hash='';return url.toString()}function speak(text){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text))}function transmit(active){if(!stream||socket?.readyState!==WebSocket.OPEN)return;talk.setAttribute('aria-pressed',String(active));talk.textContent=active?'Talking… release to send':'Hold to talk';if(active){recorder=new MediaRecorder(stream,{audioBitsPerSecond:32000});recorder.ondataavailable=e=>{if(e.data.size&&socket.readyState===WebSocket.OPEN)socket.send(e.data)};recorder.onstop=()=>state('Thinking through OBus…');recorder.start();state('Recording — release to send.')}else if(recorder?.state==='recording')recorder.stop()}async function connect(){try{const host=$('host').value,room=$('room').value,key=$('key').value;if(!host||!room||!key)return state('Enter host, room, and shared key.');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});socket=new WebSocket(wsUrl(host));socket.onopen=()=>socket.send(JSON.stringify({room,key,assistant:true}));socket.onmessage=e=>{const message=JSON.parse(e.data);if(message.type==='joined'){talk.disabled=false;state('Connected — hold to talk.')}else if(message.type==='voice.task'){const reply=`I heard: ${message.transcript}. I sent it to Codex as task ${message.task_id}.`;state(reply);speak(reply)}else if(message.type==='voice.error'){state(message.message);speak(`Voice error. ${message.message}`)}};socket.onclose=()=>{talk.disabled=true;state('Disconnected.')};$('connect').disabled=true;$('disconnect').disabled=false;state('Connecting…')}catch(error){state(`Microphone or connection error: ${error.message}`)}}function disconnect(){if(recorder?.state==='recording')recorder.stop();stream?.getTracks().forEach(track=>track.stop());socket?.close();talk.disabled=true;$('connect').disabled=false;$('disconnect').disabled=true;state('Offline')}$('connect').onclick=connect;$('disconnect').onclick=disconnect;for(const type of ['pointerdown','pointerup','pointerleave','pointercancel'])talk.addEventListener(type,()=>transmit(type==='pointerdown'));talk.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();transmit(true)}};talk.onkeyup=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();transmit(false)}};</script></body></html>
